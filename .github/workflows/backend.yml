name: Build and Deploy Backend

on:
  push:
    branches:
      - devbackend

jobs:

  deploy:
    runs-on: ubuntu-latest
#    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            cd itamityt
            git switch devbackend
            git pull
            cd docker/backend
            docker-compose up -d --build
