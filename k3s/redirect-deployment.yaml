apiVersion: apps/v1
kind: Deployment
metadata:
  name: redirect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redirect
  template:
    metadata:
      labels:
        app: redirect
    spec:
      containers:
        - name: redirect
          image: ghcr.io/ben19f/itamityt/redirect:latest
          ports:
            - containerPort: 8200
          envFrom:
            - secretRef:
                name: backend-secret
