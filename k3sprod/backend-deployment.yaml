apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: prodspaceita
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/ben19f/itamityt-backend/backend:v0.0.1
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: prod-secrets
            - configMapRef:
                name: prod-configs
