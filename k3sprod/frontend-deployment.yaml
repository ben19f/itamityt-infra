apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: prodspaceita
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/ben19f/itamityt-frontend/frontend:v0.0.1
        imagePullPolicy: Always
        ports:
        - containerPort: 80
