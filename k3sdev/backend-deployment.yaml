apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devspaceita
  #k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/ben19f/itamityt-backend/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: projectsecrets
            - configMapRef:
                name: projectconfigs
