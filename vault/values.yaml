server:
  affinity: ""

  ha:
    enabled: true

    raft:
      enabled: true
      setNodeId: true

      config: |
        ui = true

        cluster_name = "itamityt-vault"

        storage "raft" {
          path = "/vault/data"
        }

        listener "tcp" {
          address         = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_disable     = "true"
        }

        service_registration "kubernetes" {}

  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: null

injector:
  enabled: true