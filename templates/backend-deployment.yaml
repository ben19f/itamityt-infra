apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: {{ .Values.namespace }}

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"

        vault.hashicorp.com/role: "itamityt-{{ .Values.environment }}"
        vault.hashicorp.com/service: "http://vault-active.vault.svc:8200"

        vault.hashicorp.com/agent-inject-secret-config: "secret/data/itamityt/{{ .Values.environment }}"

        vault.hashicorp.com/agent-inject-template-config: |
          {{`{{- with secret "secret/data/itamityt/`}}{{ .Values.environment }}{{`" -}}`}}
          export TEST_VALUE="{{`{{ .Data.data.TEST_VALUE }}`}}"
          {{`{{- end }}`}}

    spec:
      serviceAccountName: itamityt

      imagePullSecrets:
        - name: regcred

      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          ports:
            - containerPort: 8000

          envFrom:
            - secretRef:
                name: projectsecrets
            - configMapRef:
                name: projectconfigs