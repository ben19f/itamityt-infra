apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: {{ .Values.namespace }}

spec:
  replicas: {{ .Values.backend.replicas }}

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

      annotations:
        vault.hashicorp.com/agent-requests-cpu: "50m"
        vault.hashicorp.com/agent-requests-mem: "32Mi"
        vault.hashicorp.com/agent-limits-cpu: "100m"
        vault.hashicorp.com/agent-limits-mem: "64Mi"


        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"

        vault.hashicorp.com/role: "itamityt-{{ .Values.environment }}"
        vault.hashicorp.com/service: "http://vault-active.vault.svc:8200"

        vault.hashicorp.com/agent-inject-secret-config: "secret/data/itamityt/{{ .Values.environment }}"

        vault.hashicorp.com/agent-inject-template-config: |
          {{`{{- with secret "secret/data/itamityt/`}}{{ .Values.environment }}{{`" -}}`}}
          export DATABASE_URL="{{`{{ .Data.data.DATABASE_URL }}`}}"
          export SECRET_KEY="{{`{{ .Data.data.SECRET_KEY }}`}}"
          export S3_ACCESS_KEY="{{`{{ .Data.data.S3_ACCESS_KEY }}`}}"
          export S3_SECRET_KEY="{{`{{ .Data.data.S3_SECRET_KEY }}`}}"
          export SMTP_USERNAME="{{`{{ .Data.data.SMTP_USERNAME }}`}}"
          export SMTP_PASSWORD="{{`{{ .Data.data.SMTP_PASSWORD }}`}}"
          {{`{{- end }}`}}

    spec:
      serviceAccountName: itamityt

      imagePullSecrets:
        - name: regcred

      containers:
        - name: backend
          image: {{ .Values.backend.image }}

          command:
            - /bin/sh
            - -c

          args:
            - |
              . /vault/secrets/config
              exec /usr/local/bin/python3.11 /usr/local/bin/uvicorn main:app --host 0.0.0.0 --port 8000

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: projectconfigs