apiVersion: apps/v1
kind: Deployment
metadata:
  name: redirect
  namespace: prodspaceita
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redirect
  template:
    metadata:
      labels:
        app: redirect
    spec:
      containers:
        - name: redirect
          image: ghcr.io/ben19f/itamityt-redirect/redirect:v0.1.0
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: projectsecrets
