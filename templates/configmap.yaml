apiVersion: v1
kind: ConfigMap
metadata:
  name: projectconfigs
  namespace: {{ .Values.namespace }}

data:
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"

  S3_ENDPOINT: "https://s3.ru1.storage.beget.cloud"
  S3_PUBLIC_URL: "https://s3.ru1.storage.beget.cloud/dddd45bd2079-colorful-cillian"
  S3_BUCKET: "dddd45bd2079-colorful-cillian"
  S3_REGION: "us-east-1"
  S3_PREFIX: "{{ .Values.environment }}"

  SMTP_HOST: "smtp.beget.com"
  SMTP_PORT: "465"
  SMTP_FROM: "reguser@itamityt.ru"

  PUBLIC_API_URL: "https://{{ .Values.host }}"
  YANDEX_METRIKA_ENABLED: "{{ .Values.metrica_status }}"